services:
  prod_svc_mongo_db:
    container_name: prod_container_db
    image: mongo:latest
    restart: always
    ports:
      - 27017:27017
    healthcheck:
      test:
        ["CMD-SHELL", 'mongosh --eval ''db.adminCommand("ping")'' || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env.prod
    volumes:
      - prod_vol_mongo_data:/data/db

  backend:
    build: .
    container_name: prod_container_telecom-form-ahvaan
    ports:
      - "${APP_PORT_INSIDE_LOCAL}:${APP_PORT_INSIDE_DOCKER}"
    restart: always

    env_file:
      - .env.prod
    depends_on:
      prod_svc_mongo_db:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      # - node_modules:/usr/src/app/node_modules
volumes:
  prod_vol_mongo_data:
